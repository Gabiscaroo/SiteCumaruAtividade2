<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<title> Eventos e Contato</title>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-white bg-brown">
    <div class="container">
        <a class="navbar-brand" href="index.html"> 🍦 Cumaru Gelatos Artesanais </a>
    </div>
</nav>

<div class="container py-5">

    <h1 class="text-center mb-4">Entre em contato</h1>

    <!-- FORM -->
    <form class="shadow p-4 rounded">

        <div class="mb-3">
            <label>Nome</label>
            <input type="text" class="form-control">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" class="form-control">
        </div>

        <div class="mb-3">
            <label>Mensagem</label>
            <textarea class="form-control"></textarea>
        </div>

        <button class="btn btn-danger">
            Enviar
        </button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
